                            <option value="Paris" class="bg-slate-900 text-white">Paris</option>
                        </select>
                    </div>

                    <!-- Check-in -->
                    <div class="w-full">
                        <label class="block text-[8px] sm:text-[9.5px] font-black uppercase tracking-[0.15em] text-amber-400 mb-1 flex items-center gap-1">
                            <i class="fa-regular fa-calendar-days text-[9px] sm:text-[10.5px] text-amber-400/80"></i> Check-in
                        </label>
                        <input type="date" id="filterCheckIn"
                            class="w-full h-9 sm:h-11 bg-white/10 hover:bg-white/15 border border-white/15 focus:border-amber-400 text-white font-bold text-[11px] sm:text-xs rounded-lg sm:rounded-xl px-2.5 sm:px-3 outline-none transition-all cursor-pointer shadow-inner">
                    </div>

                    <!-- Check-out -->
                    <div class="w-full">
                        <label class="block text-[8px] sm:text-[9.5px] font-black uppercase tracking-[0.15em] text-amber-400 mb-1 flex items-center gap-1">
                            <i class="fa-regular fa-calendar-days text-[9px] sm:text-[10.5px] text-amber-400/80"></i> Check-out
                        </label>
                        <input type="date" id="filterCheckOut"
                            class="w-full h-9 sm:h-11 bg-white/10 hover:bg-white/15 border border-white/15 focus:border-amber-400 text-white font-bold text-[11px] sm:text-xs rounded-lg sm:rounded-xl px-2.5 sm:px-3 outline-none transition-all cursor-pointer shadow-inner">
                    </div>

                    <!-- Search Button -->
                    <div class="col-span-2 lg:col-span-1 w-full pt-0.5 lg:pt-0">
                        <label class="hidden lg:flex items-center gap-1 text-[8px] sm:text-[9.5px] font-black uppercase tracking-[0.15em] text-transparent select-none mb-1 pointer-events-none">&nbsp;</label>
                        <button type="submit"
                            class="w-full h-9 sm:h-11 bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-black text-[11px] sm:text-xs uppercase tracking-wider rounded-lg sm:rounded-xl transition-all duration-300 shadow-[0_0_20px_rgba(245,158,11,0.35)] hover:shadow-[0_0_28px_rgba(245,158,11,0.5)] hover:scale-[1.01] active:scale-[0.98] flex items-center justify-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-magnifying-glass text-[11px] sm:text-xs"></i>
                            <span>Search Hotels</span>
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </section>

    <!-- HOTEL CARDS GRID (Exact 4-column layout & card dimensions matching Home Page Top Rated Hotels) -->
    <div class="max-w-7xl mx-auto px-4 md:px-6 pb-20 grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-6 w-full"
        id="hotelsGrid">
        <!-- Dynamic Insertion -->
    </div>

    <!-- Footer -->
    <footer class="bg-white/80 backdrop-blur-2xl border-t border-black/5 mt-auto relative overflow-hidden">
        <div class="max-w-7xl mx-auto px-6 pt-16 pb-12 relative z-10">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <a href="index.html" class="flex items-center gap-2">
                    <img src="assets/ChatGPT%20Image%20Aug%2017,%202026,%2012_36_42%20PM.png" alt="Traviora Logo" class="h-6 w-auto object-contain">
                    <span class="font-black text-slate-900 tracking-wider text-sm uppercase">Traviora Hotels</span>
                </a>
                <p class="text-slate-400 text-xs font-medium">&copy; 2026 Traviora Inc. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Storage & Logic Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/hotel-data.js"></script>
    <script>
        let allHotels = [];

        document.addEventListener('DOMContentLoaded', () => {
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileMenu = document.getElementById('mobileMenu');
            const closeMobileMenuBtn = document.getElementById('closeMobileMenuBtn');
            const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');

            if (mobileMenuBtn && mobileMenu) {
                mobileMenuBtn.addEventListener('click', () => {
                    mobileMenu.classList.remove('-translate-y-full', 'opacity-0', 'pointer-events-none');
                    mobileMenu.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
                });
            }

            const closeMenu = (e) => {
                if (mobileMenu && !mobileMenu.classList.contains('-translate-y-full')) {
                    mobileMenu.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
                    mobileMenu.classList.add('-translate-y-full', 'opacity-0', 'pointer-events-none');
                }
            };

            if (closeMobileMenuBtn) closeMobileMenuBtn.addEventListener('click', closeMenu);
            if (mobileMenuOverlay) mobileMenuOverlay.addEventListener('click', closeMenu);

            const path = window.location.pathname.split('/').pop() || 'hotels.html';
            document.querySelectorAll('#mobileMenu .mobile-link').forEach(a => {
                if (a.getAttribute('href') === path || (path === '' && a.getAttribute('href') === 'hotels.html')) {
                    const iconWrap = a.querySelector('.icon-wrap');
                    const innerCore = a.querySelector('.inner-core');
                    const beam = a.querySelector('.beam-element');
                    const text = a.querySelector('span');

                    if (beam) {
                        beam.classList.remove('opacity-0');
                        beam.classList.add('opacity-100', 'border-beam-active');
                    }

                    a.classList.add('bg-white', 'pointer-events-none', 'shadow-[0_15px_30px_-5px_rgba(0,0,0,0.08)]');
                    a.classList.remove('bg-slate-50/30', 'hover:bg-white');

                    if (text) {
                        text.classList.remove('text-slate-800');
                        text.classList.add('text-black', 'tracking-[0.25em]', 'scale-105');
                    }

                    if (innerCore) {
                        innerCore.classList.remove('bg-slate-50');
                        innerCore.classList.add('bg-white', 'shadow-sm');
                        const icon = innerCore.querySelector('i');
                        if (icon) {
                            icon.classList.remove('text-slate-800');
                            icon.classList.add('text-black');
                        }
                    }
                }
            });

            // Set default dates
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const endDate = new Date(tomorrow);
            endDate.setDate(endDate.getDate() + 3);

            if (document.getElementById('filterCheckIn')) {
                document.getElementById('filterCheckIn').value = tomorrow.toISOString().split('T')[0];
            }
            if (document.getElementById('filterCheckOut')) {
                document.getElementById('filterCheckOut').value = endDate.toISOString().split('T')[0];
            }

            if (window.TravioraHotelDb) {
                allHotels = window.TravioraHotelDb.getHotels();
            } else {
                allHotels = [
                    { id: "hotel-atlantis", name: "Atlantis The Royal", city: "Dubai", country: "UAE", rating: "4.9", pricePerNightUSD: 850, heroImage: "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80", overview: "Ultra-luxury sanctuary on Palm Jumeirah with Michelin dining and private suites." },
                    { id: "hotel-taj-mahal", name: "Taj Mahal Palace", city: "Mumbai", country: "India", rating: "4.8", pricePerNightUSD: 240, heroImage: "https://images.unsplash.com/photo-1542314831-c6a4d142104d?auto=format&fit=crop&w=800&q=80", overview: "Iconic flagship heritage hotel overlooking the Gateway of India." },
                    { id: "hotel-marina-bay", name: "Marina Bay Sands", city: "Singapore", country: "Singapore", rating: "4.9", pricePerNightUSD: 620, heroImage: "https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&w=800&q=80", overview: "Architectural wonder featuring the world's largest rooftop infinity pool." },
                    { id: "hotel-four-seasons-bali", name: "Four Seasons Resort", city: "Bali", country: "Indonesia", rating: "4.7", pricePerNightUSD: 520, heroImage: "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=800&q=80", overview: "Beachfront villas in Jimbaran Bay with ocean views." },
                    { id: "hotel-soneva-fushi", name: "Soneva Fushi", city: "Noonu Atoll", country: "Maldives", rating: "5.0", pricePerNightUSD: 1100, heroImage: "https://images.unsplash.com/photo-1499793983690-e29da59ef1c2?auto=format&fit=crop&w=800&q=80", overview: "Barefoot luxury overwater villas in private maldivian lagoon." },
                    { id: "hotel-ritz-paris", name: "Ritz Paris", city: "Paris", country: "France", rating: "4.9", pricePerNightUSD: 1250, heroImage: "https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?auto=format&fit=crop&w=800&q=80", overview: "Legendary palace hotel on Place Vendôme with grand french styling." }
                ];
            }
            renderHotels(allHotels);
        });

        // Country -> City dropdown dependency
        function onCountryChange() {
            const country = document.getElementById('filterCountry').value;
            const citySelect = document.getElementById('filterCity');

            const cityMap = {
                "ALL": ["ALL", "Dubai", "Mumbai", "Singapore", "Bali", "Noonu Atoll", "Paris"],
                "UAE": ["ALL", "Dubai", "Abu Dhabi"],
                "India": ["ALL", "Delhi", "Mumbai", "Goa", "Jaipur"],
                "Singapore": ["ALL", "Singapore"],
                "Indonesia": ["ALL", "Bali", "Ubud"],
                "Maldives": ["ALL", "Noonu Atoll", "Malé"],
                "France": ["ALL", "Paris", "Nice"]
            };

            const cities = cityMap[country] || ["ALL"];
            citySelect.innerHTML = cities.map(c => `<option value="${c}" class="bg-slate-900 text-white">${c === 'ALL' ? 'All Cities' : c}</option>`).join('');
        }

        // HOTEL CARD RENDER FUNCTION (100% Identical to Home Page Top Rated Hotels Card Design)
        function renderHotels(hotelsList) {
            const grid = document.getElementById('hotelsGrid');

            if (!hotelsList || hotelsList.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-white p-12 rounded-3xl text-center border border-slate-200">
                        <i class="fa-solid fa-hotel text-4xl text-slate-300 mb-3"></i>
                        <h3 class="font-bold text-lg text-slate-800">No properties found</h3>
                        <p class="text-xs text-slate-400 mt-1">Try selecting another country or city.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = hotelsList.map(h => `
            <div class="group relative w-full h-[340px] md:h-[420px] rounded-[1.5rem] md:rounded-[2rem] overflow-hidden cursor-pointer shadow-lg bg-black transition-all hover:shadow-[0_20px_40px_rgba(56,189,248,0.15)]" onclick="openHotelDetail('${h.id}')">
                
                <!-- Background Image -->
                <div class="absolute inset-0 bg-cover bg-center transition-all duration-[1200ms] ease-out group-hover:scale-[1.10] group-hover:opacity-60 blur-0 group-hover:blur-md" style="background-image: url('${h.heroImage}')"></div>
                
                <!-- Base Gradient -->
                <div class="absolute inset-x-0 bottom-0 h-[70%] bg-gradient-to-t from-black/95 via-black/40 to-transparent transition-opacity duration-300 group-hover:opacity-0 z-0"></div>

                <!-- Default Rating Badge -->
                <div class="absolute top-4 left-1/2 -translate-x-1/2 z-20 transition-all duration-500 group-hover:-translate-y-8 group-hover:opacity-0">
                    <div class="bg-sky-400/90 backdrop-blur-sm px-2.5 md:px-3 py-1 md:py-1.5 rounded-full shadow border border-sky-300">
                        <span class="text-[7px] md:text-[9px] font-black text-slate-900 uppercase tracking-[0.1em] md:tracking-[0.2em] shadow-sm flex items-center gap-1 md:gap-1.5 whitespace-nowrap"><i class="fa-solid fa-star text-[7px] md:text-[9px]"></i> ${h.rating || '4.9'} Rated</span>
                    </div>
                </div>

                <!-- Default Content -->
                <div class="absolute inset-0 p-3 md:p-6 z-10 transition-all duration-300 group-hover:opacity-0 group-hover:scale-95 flex flex-col justify-center items-center text-center text-white">
                    <h3 class="text-[14px] sm:text-[18px] md:text-[24px] font-serif font-black tracking-wide leading-tight mb-2 drop-shadow-lg px-2">${h.name}</h3>
                    <div class="flex items-center gap-1.5 text-sky-300">
                        <i class="fa-solid fa-location-dot text-[9px] md:text-[11px]"></i>
                        <span class="text-[8px] md:text-[10px] font-bold tracking-[0.2em] uppercase">${h.city || h.country}, ${h.country}</span>
                    </div>
                </div>

                <!-- Hover Overlay Reveal -->
                <div class="absolute inset-0 w-full h-full bg-gradient-to-br from-slate-950/95 via-slate-900/95 to-black/95 backdrop-blur-xl transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] opacity-0 group-hover:opacity-100 transform scale-95 group-hover:scale-100 z-20 flex flex-col justify-between p-4 md:p-7 text-center">
                    <div class="flex flex-col items-center transform -translate-y-4 group-hover:translate-y-0 transition-all duration-500 delay-[50ms] opacity-0 group-hover:opacity-100 relative w-full pt-1 md:pt-2">
                        <div class="bg-sky-400/10 border border-sky-400/30 px-2 md:px-3 py-1 md:py-1.5 rounded-full w-fit mb-2 md:mb-4">
                            <span class="text-[7px] md:text-[9px] font-black text-sky-400 uppercase tracking-[0.2em]">${h.badge || 'Luxury Suite'}</span>
                        </div>
                        <h3 class="text-[13px] sm:text-[16px] md:text-[22px] font-serif font-bold text-white tracking-tight leading-tight mb-2 md:mb-3">${h.name}</h3>
                        <p class="text-[8px] md:text-[11px] text-slate-300/70 leading-relaxed font-medium line-clamp-3 w-full">${h.overview || 'World-class hospitality, exclusive amenities, and breathtaking views.'}</p>
                    </div>

                    <div class="flex flex-col items-end transform translate-y-4 group-hover:translate-y-0 transition-all duration-500 delay-[100ms] opacity-0 group-hover:opacity-100 w-full pb-1 md:pb-2">
                        <div class="flex items-center justify-between w-full border-t border-sky-400/20 pt-3 md:pt-5 mt-2 md:mt-4">
                            <div class="hidden md:flex w-12 h-12 rounded-full border border-sky-400/20 bg-sky-400/10 items-center justify-center text-sky-400 shadow-inner shrink-0">
                                <i class="fa-solid fa-tags text-[16px]"></i>
                            </div>
                            <div class="flex flex-col items-center md:items-end w-full text-center md:text-right">
                                <div class="flex flex-col items-center md:items-end mb-2 md:mb-3 w-full text-center md:text-right">
                                    <span class="text-[7px] md:text-[8px] font-bold text-sky-400/80 uppercase tracking-[0.3em] mb-1">Starting Rate</span>
                                    <span class="text-[11px] md:text-[18px] font-black text-white leading-none">$${h.pricePerNightUSD} <span class="text-[8px] md:text-[10px] text-slate-500 font-medium normal-case tracking-[0.05em] ml-0.5">/ night</span></span>
                                </div>
                                <div class="flex items-center gap-3 text-white group/btn hover:text-sky-300 transition-colors cursor-pointer">
                                    <span class="text-[9px] font-bold uppercase tracking-[0.25em]">View Details</span>
                                    <div class="w-10 h-10 rounded-full bg-sky-400 flex items-center justify-center text-slate-900 shadow-[0_0_20px_rgba(56,189,248,0.25)] transition-all duration-300 group-hover/btn:bg-white group-hover/btn:text-slate-900 group-hover/btn:scale-110 shrink-0">
                                        <i class="fa-solid fa-arrow-right -rotate-45 text-[12px]"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Shimmer Sweep -->
                <div class="absolute inset-0 bg-gradient-to-tr from-white/0 via-white/20 to-white/0 transform -translate-x-[150%] group-hover:translate-x-[150%] transition-transform duration-1000 z-50 pointer-events-none mix-blend-overlay"></div>

            </div>
            `).join('');
        }

        function openHotelDetail(id) {
            const checkIn = document.getElementById('filterCheckIn').value;
            const checkOut = document.getElementById('filterCheckOut').value;
            window.location.href = `hotel-detail.html?id=${id}&checkIn=${checkIn}&checkOut=${checkOut}`;
        }

        function handleHotelSearch(evt) {
            evt.preventDefault();
            const country = document.getElementById('filterCountry').value;
            const city = document.getElementById('filterCity').value;

            let filtered = allHotels;
            if (country !== 'ALL') {
                filtered = filtered.filter(h => h.country.toLowerCase().includes(country.toLowerCase()));
            }
            if (city !== 'ALL') {
                filtered = filtered.filter(h => h.city.toLowerCase().includes(city.toLowerCase()));
            }

            renderHotels(filtered);
        }
    </script>
</body>

</html>
